    if(a < 0 || z < 0) throw new Error("index.html에서 const DEFAULT 부분을 찾지 못했어요.");
    const code = "const DEFAULT = " + JSON.stringify({profile,covers,categories,posts,notices,tracks,links,gh,chat,admin:adminCfg}, null, 2).replace(/</g, "\\u003c") + ";";
    await ghApi("PUT", "/contents/index.html", { message:"Update site data", content:b64utf8(src.slice(0, a) + code + src.slice(z)), sha:f.sha });
    m.textContent = "올렸어요! 1~2분 뒤 사이트에 반영돼요.";
  }catch(err){ m.textContent = "올리기 실패: " + err.message; }
}
// 자동 올리기: 저장할 때마다 잠깐 기다렸다가(2초) GitHub에 반영해요. 설정에서 끌 수 있어요.
function autoOn(){ try{ return localStorage.getItem("gh-auto") !== "0"; }catch(e){ return true; } }
let toastEl = null, toastT = null;
function toast(t){
  if(!toastEl){ toastEl = document.createElement("div"); toastEl.style.cssText = "position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;background:var(--win);color:var(--strong);border:1px solid var(--line);border-radius:99px;padding:6px 16px;font-size:11px;box-shadow:var(--shadow)"; document.body.appendChild(toastEl); }
  toastEl.textContent = t; toastEl.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => toastEl.style.display = "none", 3500);
}
let apT = null, apBusy = false, apAgain = false;
function autoPush(){
  if(!ghReady() || !autoOn()) return;
  clearTimeout(apT); apT = setTimeout(async () => {
    if(apBusy){ apAgain = true; return; }
    apBusy = true; const m = { textContent:"" };
    toast("GitHub에 올리는 중…"); await ghPush(m);
    toast(m.textContent.startsWith("올렸어요") ? "GitHub에 올렸어요 (1~2분 뒤 사이트에 반영)" : m.textContent);
    apBusy = false; if(apAgain){ apAgain = false; autoPush(); }
  }, 2000);
}
AM.addEventListener("focusin", e => { if(e.target.id === "body-ta") e.target.dataset.t = "1"; });
AM.addEventListener("change", async e => {
  if(e.target.id === "chat-file"){
    const f = e.target.files[0], k = chatKey, msg = AM.querySelector(".msg"); e.target.value = "";
    if(!f || !k) return;
    if(!f.type.startsWith("image/")){ msg.textContent = "이미지 파일만 올릴 수 있어요."; return; }
    try{
      const src = await storeImage(f, 240, .85);
      chat[k] = src; AM.querySelector("#cp-" + k).value = src; AM.querySelector("#cpv-" + k).innerHTML = `<img src="${esc(src)}" alt="">`;
      persist(); msg.textContent = "이미지를 바꿨어요.";
    }catch(err){ msg.textContent = "이미지를 불러오지 못했어요."; }
    return;
  }
  if(e.target.id === "cover-file"){
    const f = e.target.files[0]; if(!f || !f.type.startsWith("image/")) return;
    try{ const src = await storeImage(f, 1000, .8); AM.querySelector("#cover-val").value = src; AM.querySelector("#cv").innerHTML = `<img src="${src}" alt="">`; }catch(err){ alert("이미지를 불러오지 못했어요."); }
    e.target.value = ""; return;
  }
  if(e.target.id === "post-imgs"){
    const files = [...e.target.files].filter(f => f.type.startsWith("image/"));
    for(const f of files){
      try{
        const src = await storeImage(f, 1000, .8), id = edit.images.reduce((m, im) => Math.max(m, +im.id), 0) + 1;
        edit.images.push({ id, src });
        const ta = AM.querySelector("#body-ta"); if(ta) insTok(ta, `[[img:${id}]]`, "cur");
      }catch(err){}
    }
    AM.querySelector("#thumbs").innerHTML = thumbsHtml(); e.target.value = ""; return;
  }
  if(e.target.id === "post-files"){
    for(const f of [...e.target.files]){
      const gh1 = ghReady();
      if(!gh1 && f.size > 3 * 1024 * 1024){ alert(`${f.name}: 3MB가 넘어서 올릴 수 없어요. GitHub 토큰을 저장하면 더 큰 파일도 올릴 수 있어요. (또는 '파일 경로로 추가')`); continue; }
      if(gh1 && f.size > 20 * 1024 * 1024){ alert(`${f.name}: 20MB가 넘어서 올릴 수 없어요. GitHub 저장소에 직접 올린 뒤 '파일 경로로 추가'를 이용해 주세요.`); continue; }
      try{
        let src, isPath = false;
        if(gh1){
          try{ src = await uploadFileToGithub(f); isPath = true; }
          catch(err){ alert(`${f.name}: GitHub 업로드에 실패했어요. 브라우저에는 저장하지 않았어요.\n(${err.message})`); continue; }
        } else src = await readFileData(f);
        const id = edit.files.reduce((m, x) => Math.max(m, +x.id), 0) + 1;
        edit.files.push(isPath ? { id, name:f.name, size:f.size, src, path:true } : { id, name:f.name, size:f.size, src });
        const ta = AM.querySelector("#body-ta"); if(ta) insTok(ta, `[[file:${id}]]`, "cur");
      }catch(err){}
    }
    AM.querySelector("#fthumbs").innerHTML = filesHtml(); e.target.value = ""; return;
  }
  if(e.target.id !== "photo-file") return;
  const f = e.target.files[0], msg = AM.querySelector(".msg"); if(!f) return;
  if(!f.type.startsWith("image/")){ msg.textContent = "이미지 파일만 올릴 수 있어요."; return; }
  try{
    profile.photo = await storeImage(f, 600, .85);
    const ok = saveData(); renderHome(); autoPush();
    AM.querySelector("#pv").innerHTML = `<img src="${esc(profile.photo)}" alt="프로필">`;
    msg.textContent = ok ? "사진을 바꿨어요." : "저장 공간이 부족해서 이 브라우저에 저장하지 못했어요. 더 작은 사진을 써 보세요.";
  }catch(err){ msg.textContent = "사진을 불러오지 못했어요."; }
  e.target.value = "";
});

// 클릭 소리 (파일 없이 브라우저에서 만들어요). 설정 팝업의 '클릭 소리'에서 고르면 저장돼요.
(function(){
  const VOL=0.13;   // 전체 소리 크기 (0~1)
  const NAMES={0:"끔",1:"말랑 톡",2:"또각 키보드",3:"물방울 뿅",4:"갈축 타건",5:"나무 블록",6:"노트북 키",7:"타자기",8:"마우스 딸깍",9:"버블 팝",10:"맑은 팅"};
  let snd=1; try{ const v=localStorage.getItem("click-snd"); if(v!==null && NAMES[v]!==undefined) snd=+v; }catch(e){}
  let ac=null, nb=null;
  function init(){
    if(ac) return;
    try{
      ac=new (window.AudioContext||window.webkitAudioContext)();
      const n=Math.floor(ac.sampleRate*0.03); nb=ac.createBuffer(1,n,ac.sampleRate);
      const d=nb.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(n*0.2));
    }catch(e){ ac=null; }
  }
  function env(g,t,peak,dur){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+0.003); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); }
  function osc(type,f0,f1,t,dur,peak){
    const o=ac.createOscillator(), g=ac.createGain(); o.type=type;
    o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    env(g,t,peak,dur); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
  }
  function noise(freq,q,t,dur,peak,type){
    const s=ac.createBufferSource(); s.buffer=nb; s.playbackRate.value=0.9+Math.random()*0.2;
    const f=ac.createBiquadFilter(); f.type=type||"bandpass"; f.frequency.value=freq; f.Q.value=q;
    const g=ac.createGain(); env(g,t,peak,dur); s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t);
  }
  function play(k){
    init(); if(!ac || !k) return; if(ac.state==="suspended") ac.resume();
    const t=ac.currentTime, r=Math.random(), V=VOL;
    switch(+k){
      case 1: osc("sine",190+r*30,95,t,0.07,V*1.4); noise(900,1.2,t,0.02,V*0.5); break;
      case 2: noise(3200+r*600,2.5,t,0.018,V*1.1); osc("triangle",1400+r*200,700,t,0.02,V*0.35); osc("sine",160,90,t+0.012,0.05,V*0.5); break;
      case 3: osc("sine",520+r*60,300,t,0.09,V*1.2); break;
      case 4: noise(1400,1.5,t,0.012,V*0.8); osc("sine",130+r*15,70,t+0.004,0.09,V*1.6); osc("triangle",300,150,t,0.03,V*0.3); break;
      case 5: osc("sine",780+r*80,640,t,0.06,V*1.3); osc("triangle",1560,1300,t,0.03,V*0.3); noise(2000,3,t,0.01,V*0.3); break;
      case 6: noise(2400+r*300,1.2,t,0.012,V*0.7); osc("sine",260,160,t,0.035,V*0.7); break;
      case 7: noise(2800,1.8,t,0.014,V*1.0); osc("square",700+r*100,300,t,0.016,V*0.12); osc("sine",120,70,t+0.01,0.06,V*0.8); noise(1200,1,t+0.07,0.01,V*0.35); break;
      case 8: noise(4000,3,t,0.007,V*1.0); noise(2500,3,t+0.045,0.007,V*0.6); break;
      case 9: osc("sine",300,900,t,0.06,V*1.1); break;
      case 10: osc("sine",1200+r*100,1200,t,0.14,V*0.8); osc("sine",2400,2400,t,0.08,V*0.2); break;
    }
  }
  function tick(){ play(snd); }
  document.addEventListener("pointerdown",tick,true);
  document.addEventListener("keydown",e=>{ if(!e.repeat) tick(); },true);
  const sel=document.getElementById("s-snd");
  if(sel){
    sel.innerHTML=Object.keys(NAMES).map(k=>`<option value="${k}">${NAMES[k]}</option>`).join("");
    sel.value=snd;
    sel.onchange=()=>{ snd=+sel.value; try{ localStorage.setItem("click-snd",snd); }catch(e){} play(snd); };
  }
})();
</script>
