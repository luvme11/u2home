<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>500×500 이미지 자르기</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f6f4;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--bd:#dcdcd6;--ac:#2f6fed;--act:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232322;--tx:#ececE8;--mu:#9a9a94;--bd:#3a3a38;--ac:#6b9bff;--act:#10131a}}
:root[data-theme="dark"]{--bg:#171716;--card:#232322;--tx:#ececE8;--mu:#9a9a94;--bd:#3a3a38;--ac:#6b9bff;--act:#10131a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--mu);font-size:13px}
.wrap{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.stage{position:relative;width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;touch-action:none;cursor:grab;
background:repeating-conic-gradient(#8884 0 25%,#0000 0 50%) 0 0/20px 20px,var(--card)}
.stage.drag{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
.grid{position:absolute;inset:0;pointer-events:none;background:
linear-gradient(#fff6,#fff6) 33.33% 0/1px 100% no-repeat,linear-gradient(#fff6,#fff6) 66.66% 0/1px 100% no-repeat,
linear-gradient(#fff6,#fff6) 0 33.33%/100% 1px no-repeat,linear-gradient(#fff6,#fff6) 0 66.66%/100% 1px no-repeat;
box-shadow:inset 0 0 0 1px #0004}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:var(--mu);padding:20px;cursor:pointer}
.empty b{color:var(--tx);font-size:16px}
.hint{font-size:12px;color:var(--mu);margin-top:8px;text-align:center}
.row{margin-bottom:14px}
.row label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;color:var(--mu)}
.row label span{color:var(--tx);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ac)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
button,.btn,select,input[type=text]{font:inherit;font-size:13px;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 11px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--ac)}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600;padding:10px 16px;font-size:14px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--bd);border-radius:6px;background:none}
.msg{font-size:13px;color:var(--mu);margin-top:10px;min-height:20px}
.sep{height:1px;background:var(--bd);margin:4px 0 14px}
#fallback{display:none;margin-top:10px}
#fallback img{max-width:100%;border-radius:8px;border:1px solid var(--bd)}
</style>
</head>
<body>
<main>
<h1>500×500 이미지 자르기</h1>
<p class="sub">이미지를 올리고, 드래그로 위치를 옮기고 슬라이더로 크기를 조절한 뒤 저장하세요.</p>
<div class="wrap">
 <div class="card">
  <div class="stage" id="stage">
   <canvas id="cv" width="500" height="500"></canvas>
   <div class="grid" id="grid" hidden></div>
   <div class="empty" id="empty"><b>이미지를 끌어다 놓거나 클릭</b><span>붙여넣기(Ctrl+V)도 가능해요</span></div>
  </div>
  <div class="hint">드래그: 이동 · 마우스 휠: 확대/축소 · 출력 크기 500×500px</div>
 </div>
 <div class="card">
  <div class="btns">
   <label class="btn" for="file">📁 이미지 선택</label>
   <input id="file" type="file" accept="image/*" hidden>
   <button id="rotL" disabled>⟲ 90°</button>
   <button id="rotR" disabled>⟳ 90°</button>
   <button id="flip" disabled>↔ 좌우반전</button>
  </div>
  <div class="row"><label>크기 (확대)<span id="zv">100%</span></label><input id="zoom" type="range" min="10" max="500" value="100" disabled></div>
  <div class="row"><label>가로 위치 (X)<span id="xv">0</span></label><input id="px" type="range" min="-500" max="500" value="0" disabled></div>
  <div class="row"><label>세로 위치 (Y)<span id="yv">0</span></label><input id="py" type="range" min="-500" max="500" value="0" disabled></div>
  <div class="row"><label>미세 회전<span id="rv">0°</span></label><input id="rot" type="range" min="-45" max="45" step="0.5" value="0" disabled></div>
  <div class="btns">
   <button id="fill" disabled>꽉 채우기</button>
   <button id="fit" disabled>전체 보이기</button>
   <button id="reset" disabled>초기화</button>
  </div>
  <div class="sep"></div>
  <div class="row inline">
   <span style="color:var(--mu);font-size:13px">빈 공간</span>
   <label class="inline" style="margin:0;color:var(--tx)"><input type="checkbox" id="transp" checked> 투명</label>
   <input type="color" id="bgc" value="#ffffff">
   <label class="inline" style="margin:0;color:var(--tx)"><input type="checkbox" id="gridT" checked> 격자</label>
  </div>
  <div class="row inline">
   <select id="fmt"><option value="png">PNG</option><option value="jpg">JPG</option><option value="webp">WEBP</option></select>
   <input type="text" id="fname" value="cropped_500x500" style="flex:1;min-width:120px" aria-label="파일 이름">
  </div>
  <button class="primary" id="save" disabled>💾 500×500으로 저장</button>
  <div class="msg" id="msg"></div>
  <div id="fallback"><div class="hint" style="text-align:left">이 환경에서는 바로 저장이 안 돼요. 아래 이미지를 길게 누르거나 우클릭해서 저장하세요.</div><img id="fbimg" alt="결과 이미지"></div>
 </div>
</div>
</main>
<script>
(function(){
var S=500,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var $=function(i){return document.getElementById(i)};
var img=null,name0='cropped',st={z:1,x:0,y:0,r:0,q:0,f:1,base:1};
var ctrls=['zoom','px','py','rot','rotL','rotR','flip','fill','fit','reset','save'];

function setEnabled(on){ctrls.forEach(function(i){$(i).disabled=!on})}
function dims(){var q=st.q%2!==0;return {w:q?img.height:img.width,h:q?img.width:img.height}}
function calcBase(mode){var d=dims();st.base=mode==='fit'?Math.min(S/d.w,S/d.h):Math.max(S/d.w,S/d.h)}

function draw(out){
  ctx.clearRect(0,0,S,S);
  if(out){
    var fm=$('fmt').value;
    if(!$('transp').checked||fm==='jpg'){ctx.fillStyle=$('transp').checked?'#ffffff':$('bgc').value;ctx.fillRect(0,0,S,S)}
  }else if(!$('transp').checked){ctx.fillStyle=$('bgc').value;ctx.fillRect(0,0,S,S)}
  if(!img)return;
  ctx.save();
  ctx.translate(S/2+st.x,S/2+st.y);
  ctx.rotate((st.q*90+st.r)*Math.PI/180);
  var s=st.base*st.z;
  ctx.scale(s*st.f,s);
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(img,-img.width/2,-img.height/2);
  ctx.restore();
}
function sync(){
  $('zoom').value=Math.round(st.z*100);$('zv').textContent=Math.round(st.z*100)+'%';
  $('px').value=Math.round(st.x);$('xv').textContent=Math.round(st.x);
  $('py').value=Math.round(st.y);$('yv').textContent=Math.round(st.y);
  $('rot').value=st.r;$('rv').textContent=st.r+'°';
  draw(false);
}
function load(file){
  if(!file||!/^image\//.test(file.type)){$('msg').textContent='이미지 파일만 사용할 수 있어요.';return}
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      img=im;name0=(file.name||'image').replace(/\.[^.]+$/,'');
      $('fname').value=name0+'_500x500';
      st={z:1,x:0,y:0,r:0,q:0,f:1,base:1};calcBase('fill');
      $('empty').style.display='none';$('grid').hidden=!$('gridT').checked;
      setEnabled(true);sync();
      $('msg').textContent='원본 '+im.width+'×'+im.height+'px';
      $('fallback').style.display='none';
    };
    im.onerror=function(){$('msg').textContent='이미지를 불러오지 못했어요.'};
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
$('file').addEventListener('change',function(e){load(e.target.files[0]);e.target.value=''});
$('empty').addEventListener('click',function(){$('file').click()});
var stage=$('stage');
['dragover','dragenter'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()})});
document.addEventListener('drop',function(e){e.preventDefault();var f=e.dataTransfer&&e.dataTransfer.files[0];if(f)load(f)});
document.addEventListener('paste',function(e){var it=[].slice.call(e.clipboardData&&e.clipboardData.items||[]).find(function(i){return /^image\//.test(i.type)});if(it)load(it.getAsFile())});

var drag=null;
stage.addEventListener('pointerdown',function(e){if(!img)return;drag={x:e.clientX,y:e.clientY,ox:st.x,oy:st.y};stage.setPointerCapture(e.pointerId);stage.classList.add('drag')});
stage.addEventListener('pointermove',function(e){if(!drag)return;var k=S/stage.getBoundingClientRect().width;st.x=drag.ox+(e.clientX-drag.x)*k;st.y=drag.oy+(e.clientY-drag.y)*k;sync()});
['pointerup','pointercancel'].forEach(function(t){stage.addEventListener(t,function(){drag=null;stage.classList.remove('drag')})});
stage.addEventListener('wheel',function(e){if(!img)return;e.preventDefault();st.z=Math.min(5,Math.max(.1,st.z*(e.deltaY<0?1.05:.95)));sync()},{passive:false});

$('zoom').addEventListener('input',function(e){st.z=e.target.value/100;sync()});
$('px').addEventListener('input',function(e){st.x=+e.target.value;sync()});
$('py').addEventListener('input',function(e){st.y=+e.target.value;sync()});
$('rot').addEventListener('input',function(e){st.r=+e.target.value;sync()});
$('rotL').addEventListener('click',function(){st.q=(st.q+3)%4;st.x=st.y=0;calcBase('fill');st.z=1;sync()});
$('rotR').addEventListener('click',function(){st.q=(st.q+1)%4;st.x=st.y=0;calcBase('fill');st.z=1;sync()});
$('flip').addEventListener('click',function(){st.f*=-1;sync()});
$('fill').addEventListener('click',function(){calcBase('fill');st.z=1;st.x=st.y=0;sync()});
$('fit').addEventListener('click',function(){calcBase('fill');var d=dims();st.z=Math.min(S/d.w,S/d.h)/Math.max(S/d.w,S/d.h);st.x=st.y=0;sync()});
$('reset').addEventListener('click',function(){st.r=0;st.f=1;st.q=0;calcBase('fill');st.z=1;st.x=st.y=0;sync()});
['transp','bgc'].forEach(function(i){$(i).addEventListener('input',function(){draw(false)})});
$('gridT').addEventListener('change',function(){$('grid').hidden=!img||!$('gridT').checked});

$('save').addEventListener('click',async function(){
  if(!img)return;
  var fm=$('fmt').value,mime=fm==='jpg'?'image/jpeg':'image/'+fm;
  var fn=($('fname').value.trim()||'cropped_500x500').replace(/[\\/:*?"<>|]/g,'_')+'.'+fm;
  draw(true);
  var blob=await new Promise(function(r){cv.toBlob(r,mime,.95)});
  draw(false);
  if(!blob){$('msg').textContent='이미지를 만들지 못했어요.';return}
  var dl=null;try{dl=await claude.use('downloads')}catch(e){}
  if(!dl){
    var rd=new FileReader();rd.onload=function(){$('fbimg').src=rd.result;$('fallback').style.display='block'};rd.readAsDataURL(blob);return;
  }
  try{await dl.save({filename:fn,data:blob});$('msg').textContent='저장했어요: '+fn}
  catch(e){$('msg').textContent=(e&&e.code==='declined')?'저장을 취소했어요.':'저장하지 못했어요. 다시 시도해 주세요.'}
});
draw(false);
})();
</script>
</body>
</html>
