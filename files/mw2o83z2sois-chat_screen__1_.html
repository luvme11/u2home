<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHAT</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #0a0a0a;
    --text: #f0f0f0;
    --muted: #8a8a8a;
    --red: #d42b2b;
    --bubble: #181818;
    --bubble-line: #2b2b2b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #050505;
    color: var(--text);
    font-family: 'Pretendard', -apple-system, 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 0 0 150px;
  }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }

  /* 캡쳐본 기준: 가로 368px, 세로 407px */
  .phone {
    width: 368px; height: 407px; max-width: 100%;
    background: var(--bg);
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }

  /* 상단 상태바 */
  .statusbar { height: 22px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 3px 8px 0; }
  .statusbar #clock { font-size: 9px; color: #c8c8c8; letter-spacing: .04em; }
  .statusbar svg { width: 12px; height: 9px; }

  /* 헤더 */
  .header { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px; }
  .back { width: 14px; height: 14px; flex: none; }
  .who { line-height: 1; }
  .who #name { font-size: 15px; line-height: 18px; font-weight: 700; display: block; min-width: 8px; }
  .who .on { display: flex; align-items: center; gap: 5px; margin-top: 4px; font-size: 10px; line-height: 12px; letter-spacing: .1em; color: var(--muted); }
  .who .on i { width: 4px; height: 4px; border-radius: 50%; background: var(--red); }

  /* 채팅 영역 */
  .chat { flex: 1; min-height: 0; overflow-y: auto; padding: 3px 8px 12px; scrollbar-width: none; }
  .chat::-webkit-scrollbar { display: none; }
  .item { position: relative; margin-top: 6px; }

  .item.date { display: flex; align-items: center; gap: 12px; margin: 14px 0 17px; }
  .item.date .ln { flex: 1; height: 1px; background: #2f2f2f; }
  .item.date .dt { font-size: 10px; letter-spacing: .12em; color: var(--muted); white-space: nowrap; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; min-width: 10px; }
  .item.date + .item { margin-top: 0; }

  .who-label { font-size: 11px; line-height: 12px; font-weight: 700; margin: 10px 0 3px; }

  .row { display: flex; align-items: flex-end; }
  .item.me .row { justify-content: flex-end; }
  .bubble {
    flex: 0 1 auto; min-width: 0; max-width: 92%;
    padding: 11px 14px; font-size: 14px; line-height: 21px;
    white-space: pre-wrap; word-break: break-word;
  }
  .item.them .bubble { background: var(--bubble); border: 1px solid var(--bubble-line); border-radius: 14px 14px 14px 3px; }
  .item.me .bubble { background: #fff; color: #111; border-radius: 14px 14px 3px 14px; }
  .time { flex: none; font-size: 10px; line-height: 12px; color: #777; margin-bottom: 3px; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  .item.them .time { margin-left: 8px; }
  .item.me .time { margin-right: 8px; }

  /* 타자 치는 중 말풍선 */
  .typing {
    display: inline-flex; gap: 6px; padding: 14px 15px;
    background: var(--bubble); border: 1px solid var(--bubble-line); border-radius: 14px 14px 14px 3px;
  }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: #777; animation: dot 1.1s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 70%, 100% { opacity: .35; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-3px); } }

  .pop { animation: pop .28s ease-out both; }
  .item.them .pop { transform-origin: left bottom; }
  .item.me .pop { transform-origin: right bottom; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }

  /* 하단 입력 막대 */
  .inputbar { height: 41px; flex: none; border-top: 1px solid #1f1f1f; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 8px; }
  .inputbar #placeholder { font-size: 11.5px; color: #6a6a6a; min-width: 10px; }
  .send { width: 26px; height: 26px; background: var(--red); display: grid; place-items: center; flex: none; }
  .send svg { width: 12px; height: 12px; }

  /* 수정 모드 */
  .ctl { display: none; position: absolute; top: -9px; right: 0; gap: 2px; z-index: 3; }
  body.editing .ctl { display: flex; }
  .ctl button { width: 20px; height: 18px; background: #222; color: #ddd; border: 1px solid #555; font: 11px/1 'Pretendard', sans-serif; cursor: pointer; }
  .ctl button:hover { border-color: #fff; }
  body.editing [contenteditable] { outline: 1px dashed rgba(212, 43, 43, .55); outline-offset: 2px; cursor: text; }
  body.editing [contenteditable]:focus { outline: 1px solid var(--red); }

  /* 하단 도구 막대 */
  .toolbar, .addbar {
    position: fixed; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; padding: 8px; background: #151515; border: 1px solid #333; z-index: 10;
  }
  .toolbar { bottom: 18px; }
  .addbar { bottom: 82px; display: none; }
  .addbar.show { display: flex; }
  .tbtn {
    background: #0b0b0b; color: var(--text); border: 1px solid #555; padding: 9px 12px;
    font: 600 13px 'Pretendard', sans-serif; cursor: pointer; white-space: nowrap;
  }
  .tbtn:hover { border-color: #fff; }
  .tbtn.on { background: var(--red); border-color: var(--red); }

  /* HTML 코드 창 */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  .modal.open { display: flex; }
  .panel { width: 100%; max-width: 760px; max-height: 90vh; background: #121212; border: 1px solid #444; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .panel h2 { font-size: 14px; }
  .panel p { font-size: 12px; color: var(--muted); }
  .panel textarea {
    flex: 1; min-height: 300px; resize: none; background: #060606; color: #d6d6d6;
    border: 1px solid #333; padding: 12px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
  }
  .panel .btns { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body class="">
  <main class="phone" id="phone">
    <div class="statusbar">
      <span id="clock" class="mono">15:42<br></span>
      <svg viewBox="0 0 12 9" fill="#8a8a8a"><rect x="0" y="6" width="2" height="3"></rect><rect x="3.3" y="4" width="2" height="5"></rect><rect x="6.6" y="2" width="2" height="7"></rect><rect x="10" y="0" width="2" height="9" fill="#555"></rect></svg>
    </div>

    <header class="header">
      <svg class="back" viewBox="0 0 14 14" fill="none" stroke="#aaa" stroke-width="1.4" stroke-linecap="square"><path d="M13 7H1.5M6 2L1.5 7 6 12"></path></svg>
      <div class="who">
        <span id="name">Veronica</span>
        <div class="on mono"><i></i><span id="status">ONLINE</span></div>
      </div>
    </header>

    <section class="chat" id="chat"></section>

    <footer class="inputbar">
      <span id="placeholder">메시지를 입력할 수 없는 채널입니다.</span>
      <div class="send">
        <svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="square"><path d="M2.5 9.5l7-7M3.5 2.5h6v6"></path></svg>
      </div>
    </footer>
  </main>

  <div id="editor-ui"></div>

<script type="application/json" id="chatData">
{
  "meta": {
    "clock": "15:42",
    "name": "Veronica",
    "status": "ONLINE",
    "placeholder": "메시지를 입력할 수 없는 채널입니다."
  },
  "items": [
    {
      "type": "date",
      "text": "2080.11.12"
    },
    {
      "type": "msg",
      "side": "me",
      "text": "Sweetheart? Did someone steal my card or are you buying out an entire arcade?(자기야? 누가 내 카드 훔쳐 간 거야 아니면 오락실을 통째로 인수하는 중인 거야?)",
      "time": "15:42"
    },
    {
      "type": "msg",
      "side": "me",
      "text": "Why is it charging 5 bucks every three seconds?! Seven hundred times in a row?!(왜 삼 초마다 오 달러씩 찍히는 건데?! 칠백 번 연속으로 결제됐다고?!)",
      "time": "15:42"
    },
    {
      "type": "msg",
      "side": "me",
      "text": "Wait Don't tell me my girlfriend got hooked on a rigged slot machine without me!! Hold on I am running over there right now!!(잠깐 설마 내 여자친구가 나도 없이 사기 슬롯머신에 코 꿴 거야?! 가만있어 봐 내가 지금 당장 달려간다!!)",
      "time": "15:40"
    }
  ]
}
</script>

<script>
  const $ = id => document.getElementById(id);

  /* 도구 막대/코드 창은 여기서 만들어요 (내보내는 코드에는 들어가지 않음) */
  const ui = $('editor-ui');
  ui.innerHTML = '';
  function el(tag, props, kids) {
    const e = document.createElement(tag);
    Object.keys(props || {}).forEach(k => { if (k === 'text') e.textContent = props[k]; else e.setAttribute(k, props[k]); });
    (kids || []).forEach(c => e.appendChild(c));
    return e;
  }
  ui.appendChild(el('div', { class: 'addbar', id: 'addbar' }, [
    el('button', { class: 'tbtn', id: 'addThem', type: 'button', text: '+ 상대 말풍선' }),
    el('button', { class: 'tbtn', id: 'addMe', type: 'button', text: '+ 내 말풍선' }),
    el('button', { class: 'tbtn', id: 'addDate', type: 'button', text: '+ 날짜선' })
  ]));
  ui.appendChild(el('div', { class: 'toolbar', id: 'toolbar' }, [
    el('button', { class: 'tbtn', id: 'editBtn', type: 'button', text: '✎ 수정 모드' }),
    el('button', { class: 'tbtn', id: 'playBtn', type: 'button', text: '▶ 다시 재생' }),
    el('button', { class: 'tbtn', id: 'codeBtn', type: 'button', text: 'HTML 코드 받기' })
  ]));
  const ta = el('textarea', { id: 'codeBox', spellcheck: 'false' });
  ta.readOnly = true;
  ui.appendChild(el('div', { class: 'modal', id: 'modal' }, [
    el('div', { class: 'panel' }, [
      el('h2', { text: '수정한 내용이 반영된 HTML 코드' }),
      el('p', { text: '복사해서 .html 파일로 저장하면 지금 화면 그대로 열려요. 그 파일에서도 또 수정할 수 있어요.' }),
      ta,
      el('div', { class: 'btns' }, [
        el('button', { class: 'tbtn on', id: 'copyBtn', type: 'button', text: '코드 복사' }),
        el('button', { class: 'tbtn', id: 'dlBtn', type: 'button', text: '.html 다운로드' }),
        el('button', { class: 'tbtn', id: 'closeBtn', type: 'button', text: '닫기' })
      ])
    ])
  ]));

  const chat = $('chat');
  const state = JSON.parse($('chatData').textContent);
  let editing = false;
  let runId = 0;

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const readText = el => (el.innerText || '').replace(/\n$/, '');
  const scrollEnd = () => chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });

  /* ---------- 상단 정보(시계 / 이름 / 상태 / 안내문) ---------- */
  const META = { clock: 'clock', name: 'name', status: 'status', placeholder: 'placeholder' };
  Object.keys(META).forEach(k => {
    const el = $(META[k]);
    el.textContent = state.meta[k];
    el.addEventListener('input', () => {
      state.meta[k] = readText(el).trim();
      if (k === 'name') document.querySelectorAll('.who-label').forEach(l => l.textContent = state.meta.name);
    });
  });

  /* ---------- 항목 만들기 ---------- */
  function mkBtn(label, title, fn) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label; b.title = title;
    b.addEventListener('click', e => { e.stopPropagation(); fn(); });
    return b;
  }

  function controls(idx) {
    const it = state.items[idx];
    const c = document.createElement('div');
    c.className = 'ctl';
    c.appendChild(mkBtn('↑', '위로', () => move(idx, -1)));
    c.appendChild(mkBtn('↓', '아래로', () => move(idx, 1)));
    if (it.type === 'msg') c.appendChild(mkBtn('⇄', '왼쪽/오른쪽 바꾸기', () => { it.side = it.side === 'me' ? 'them' : 'me'; renderStatic(); }));
    c.appendChild(mkBtn('✕', '삭제', () => { state.items.splice(idx, 1); renderStatic(); }));
    return c;
  }

  function bindText(el, obj, key) {
    el.textContent = obj[key] || '';
    el.addEventListener('input', () => { obj[key] = readText(el); });
  }

  function itemEl(idx) {
    const it = state.items[idx];
    const prev = state.items[idx - 1];
    const next = state.items[idx + 1];
    const wrap = document.createElement('div');
    wrap.appendChild(controls(idx));

    if (it.type === 'date') {
      wrap.className = 'item date';
      const l1 = document.createElement('span'); l1.className = 'ln';
      const dt = document.createElement('span'); dt.className = 'dt'; bindText(dt, it, 'text');
      const l2 = document.createElement('span'); l2.className = 'ln';
      wrap.append(l1, dt, l2);
      return { wrap, row: null };
    }

    wrap.className = 'item ' + it.side;
    if (it.side === 'them' && !(prev && prev.type === 'msg' && prev.side === 'them')) {
      const lb = document.createElement('div');
      lb.className = 'who-label'; lb.textContent = state.meta.name;
      wrap.appendChild(lb);
    }
    const row = document.createElement('div'); row.className = 'row';
    const b = document.createElement('div'); b.className = 'bubble'; bindText(b, it, 'text');
    const showTime = !(next && next.type === 'msg' && next.side === it.side);
    if (showTime) {
      const t = document.createElement('div'); t.className = 'time'; bindText(t, it, 'time');
      if (it.side === 'me') row.append(t, b); else row.append(b, t);
    } else {
      row.append(b);
    }
    return { wrap, row };
  }

  function typingEl() {
    const t = document.createElement('div');
    t.className = 'typing pop';
    t.innerHTML = '<span></span><span></span><span></span>';
    return t;
  }

  /* ---------- 한 번에 그리기 (수정용) ---------- */
  function renderStatic() {
    runId++;
    chat.innerHTML = '';
    state.items.forEach((_, i) => {
      const { wrap, row } = itemEl(i);
      if (row) wrap.appendChild(row);
      chat.appendChild(wrap);
    });
    applyEditable();
  }

  /* ---------- 한 개씩 도착하는 재생 ---------- */
  async function play() {
    const id = ++runId;
    chat.innerHTML = '';
    chat.scrollTop = 0;
    await sleep(500);
    for (let i = 0; i < state.items.length; i++) {
      if (id !== runId) return;
      const it = state.items[i];
      const { wrap, row } = itemEl(i);
      chat.appendChild(wrap);

      if (it.type === 'date') {
        wrap.classList.add('pop');
        scrollEnd();
        await sleep(450);
        continue;
      }
      if (it.side === 'them') {
        const ty = typingEl();
        wrap.appendChild(ty);
        scrollEnd();
        await sleep(Math.min(2200, 600 + (it.text || '').length * 35));
        if (id !== runId) return;
        ty.remove();
      } else {
        await sleep(700);
        if (id !== runId) return;
      }
      row.classList.add('pop');
      wrap.appendChild(row);
      scrollEnd();
      await sleep(350);
    }
  }

  /* ---------- 수정 모드 ---------- */
  const EDITABLE_SEL = '#clock,#name,#status,#placeholder,.dt,.bubble,.time';
  function applyEditable() {
    document.querySelectorAll(EDITABLE_SEL).forEach(el => {
      if (editing) el.setAttribute('contenteditable', 'plaintext-only');
      else el.removeAttribute('contenteditable');
    });
  }

  function setEditing(on) {
    editing = on;
    document.body.classList.toggle('editing', on);
    $('addbar').classList.toggle('show', on);
    $('editBtn').textContent = on ? '✔ 수정 끝내기' : '✎ 수정 모드';
    $('editBtn').classList.toggle('on', on);
    if (on) renderStatic(); else applyEditable();
  }
  $('editBtn').addEventListener('click', () => setEditing(!editing));

  function move(idx, d) {
    const j = idx + d;
    if (j < 0 || j >= state.items.length) return;
    const tmp = state.items[idx]; state.items[idx] = state.items[j]; state.items[j] = tmp;
    renderStatic();
  }

  function lastTime() {
    for (let i = state.items.length - 1; i >= 0; i--) if (state.items[i].type === 'msg') return state.items[i].time;
    return state.meta.clock;
  }
  function addItem(it) {
    state.items.push(it);
    renderStatic();
    chat.scrollTop = chat.scrollHeight;
  }
  $('addThem').addEventListener('click', () => addItem({ type: 'msg', side: 'them', text: '새 메시지', time: lastTime() }));
  $('addMe').addEventListener('click', () => addItem({ type: 'msg', side: 'me', text: '내 답장', time: lastTime() }));
  $('addDate').addEventListener('click', () => addItem({ type: 'date', text: '2080. 11. 01' }));

  // Enter는 입력 종료, Shift+Enter는 줄바꿈
  document.addEventListener('keydown', e => {
    const t = e.target.closest && e.target.closest('[contenteditable]');
    if (t && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); t.blur(); }
  });

  $('playBtn').addEventListener('click', () => { if (editing) setEditing(false); play(); });

  /* ---------- HTML 코드 만들기 ---------- */
  function buildHTML() {
    const clone = document.documentElement.cloneNode(true);
    clone.querySelector('body').classList.remove('editing');
    clone.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
    clone.querySelector('#chat').innerHTML = '';
    clone.querySelector('#editor-ui').innerHTML = '';
    clone.querySelector('#chatData').textContent =
      '\n' + JSON.stringify(state, null, 2).replace(/</g, '\\u003c') + '\n';
    return '<!doctype html>\n' + clone.outerHTML;
  }

  const modal = $('modal'), codeBox = $('codeBox'), copyBtn = $('copyBtn');
  function openModal() {
    codeBox.value = buildHTML();
    copyBtn.textContent = '코드 복사';
    modal.classList.add('open');
    codeBox.focus();
    codeBox.select();
  }
  function closeModal() { modal.classList.remove('open'); }
  $('codeBtn').addEventListener('click', openModal);
  $('closeBtn').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

  copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(codeBox.value); }
    catch (e) { codeBox.select(); document.execCommand('copy'); }
    copyBtn.textContent = '복사 완료 ✔';
    setTimeout(() => { copyBtn.textContent = '코드 복사'; }, 1800);
  });

  $('dlBtn').addEventListener('click', () => {
    const blob = new Blob([codeBox.value], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'chat_screen.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  /* ---------- 시작: 한 개씩 도착 ---------- */
  play();
</script>


</body></html>
